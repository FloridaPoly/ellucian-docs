          - recipientType: process-variable
            value: __requestedFor
        otherRecipients: []
        subjectSelectedData: []
        emailContent: "<p>Hello,</p><p>We’ve finished processing your contact information update request. Here’s a summary of what happened.</p><p><strong>What we updated</strong><br><variable contenteditable=\"false\" data-variable=\"appliedSummary\">﻿<span contenteditable=\"false\">{{appliedSummary}}</span>﻿</variable></p><p><strong>What we didn’t change</strong><br><variable contenteditable=\"false\" data-variable=\"skippedSummary\">﻿<span contenteditable=\"false\">{{skippedSummary}}</span>﻿</variable></p><p><strong>Approval decisions</strong></p><p><strong>Name change — Registrar’s Office</strong><br>Decision: <variable contenteditable=\"false\" data-variable=\"Registrar Approval Outcome\">﻿<span contenteditable=\"false\">{{Registrar Approval Outcome}}</span>﻿</variable><br>Note: <variable contenteditable=\"false\" data-variable=\"Registrar Approval Comment\">﻿<span contenteditable=\"false\">{{Registrar Approval Comment}}</span>﻿</variable></p><p><strong>Address change — Student Business Services</strong><br>Decision: <variable contenteditable=\"false\" data-variable=\"SBS Approval Outcome\">﻿<span contenteditable=\"false\">{{SBS Approval Outcome}}</span>﻿</variable><br>Note: <variable contenteditable=\"false\" data-variable=\"SBS Approval Comment\">﻿<span contenteditable=\"false\">{{SBS Approval Comment}}</span>﻿</variable></p><p>If something you requested doesn’t appear in your records within 2 business days, please contact the Registrar’s Office (name changes) or Student Business Services (address changes).</p><p>Thank you,<br>Florida Polytechnic University</p>"
